<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIH26101 — Authentication</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="auth-page">
      <section class="form-container" aria-labelledby="auth-title">
        <h2 id="auth-title">Welcome to SIH26101</h2>
        <p id="auth-subtitle">Please login or register to continue.</p>
        
<!------------------------------------------------------------------LOGIN/REGISTER TOGGLE---------------------------------------------------------------------------------->
         
        <div class="auth-toggle" role="tablist" aria-label="Authentication mode">
            <!--Login-btn-->
          <button
            type="button"
            id="login-toggle"
            class="active"
            role="tab"
            aria-selected="true"
            aria-controls="login-form"
          >
            Login
          </button>
            <!--Register-btn-->
          <button
            type="button"
            id="register-toggle"
            role="tab"
            aria-selected="false"
            aria-controls="register-form"
          >
            Register
          </button>
        </div>
        
<!------------------------------------------------------------------LOGIN FORM---------------------------------------------------------------------------------->

        <form
          id="login-form"
          class="login-container"
          novalidate
          aria-label="Login form"
        >

        <!--Email Input-->
          <label for="login-email">Email</label>
          <div class="input-icon-wrapper">
            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
              aria-describedby="login-email-error"
            />
            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"
              />
            </svg>
            <span class="input-indicator" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.489 2 2 6.489 2 12s4.489 10 10 10 10-4.489 10-10S17.511 2 12 2Zm4.707 8.707-5 5A.996.996 0 0 1 11 16c-.256 0-.512-.098-.707-.293l-3-3a1 1 0 0 1 1.414-1.414L11 13.586l4.293-4.293a1 1 0 1 1 1.414 1.414Z"
                        fill="#40C057"
                    />
                </svg>
            </span>
          </div>

          <p id="login-email-error" class="field-error" aria-live="polite"></p>

          <!--Password Input-->
          <label for="login-password">Password</label>
          <div class="input-icon-wrapper">
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              aria-describedby="login-password-error"
            />
            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V6Z"
              />
            </svg>
            <button
              type="button"
              class="password-toggle"
              data-target="login-password"
              aria-label="Show password"
              aria-pressed="false"
            >
                <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                    <path
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                    />
                    <circle
                        cx="12"
                        cy="12"
                        r="2.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />
                </svg>
          </div>
          <p id="login-password-error" class="field-error" aria-live="polite"></p>

          <div class="forgot-password-row">
            <a class="forgot-password" href="#forgot-password">Forgot Password?</a>
          </div>

          <button type="submit" id="login-btn">Login</button>

          <div class="auth-divider" aria-hidden="true">OR</div>

          <button type="button" class="google-btn" id="google-signin-btn">
            <span class="google-icon" aria-hidden="true">
                <svg
                    class="google-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 48 48"
                    aria-hidden="true"
                >
                    <path
                        fill="#FFC107"
                        d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.223 36 24 36c-6.627 0-12-5.373-12-12S17.373 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917Z"
                    />
                    <path
                        fill="#FF3D00"
                        d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4c-7.682 0-14.344 4.337-17.694 10.691Z"
                    />
                    <path
                        fill="#4CAF50"
                        d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44Z"
                    />
                    <path
                        fill="#1976D2"
                        d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917Z"
                    />
                </svg>
            </span>
            Continue with Google
          </button>
        </form>
        
<!------------------------------------------------------------------REGISTER FORM---------------------------------------------------------------------------------->
        
        <form
          id="register-form"
          class="register-container hidden"
          novalidate
          aria-label="Registration form"
        >
        <!--Full Name Input-->
          <label for="register-name">Full Name</label>
          <div class="input-icon-wrapper">
            <input
              type="text"
              id="register-name"
              name="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
              required
              aria-describedby="register-name-error"
            />
            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.01-8 4.5V20h16v-1.5c0-2.49-3.58-4.5-8-4.5Z"
              />
            </svg>
            <span class="input-indicator" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.489 2 2 6.489 2 12s4.489 10 10 10 10-4.489 10-10S17.511 2 12 2Zm4.707 8.707-5 5A.996.996 0 0 1 11 16c-.256 0-.512-.098-.707-.293l-3-3a1 1 0 0 1 1.414-1.414L11 13.586l4.293-4.293a1 1 0 1 1 1.414 1.414Z"
                        fill="#40C057"
                    />
                </svg>
            </span>
          </div>
          <p id="register-name-error" class="field-error" aria-live="polite"></p>

          <!--Email Input-->
          <label for="register-email">Email</label>
          <div class="input-icon-wrapper">
            <input
              type="email"
              id="register-email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
              disabled
              aria-describedby="register-email-error"
            />
            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"
              />
            </svg>
            <span class="input-indicator" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.489 2 2 6.489 2 12s4.489 10 10 10 10-4.489 10-10S17.511 2 12 2Zm4.707 8.707-5 5A.996.996 0 0 1 11 16c-.256 0-.512-.098-.707-.293l-3-3a1 1 0 0 1 1.414-1.414L11 13.586l4.293-4.293a1 1 0 1 1 1.414 1.414Z"
                        fill="#40C057"
                    />
                    </svg>
            </span>
          </div>
          <p id="register-email-error" class="field-error" aria-live="polite"></p>

          <!--Password Input-->
          <label for="register-password">Password</label>
          <div class="input-icon-wrapper">
            <input
              type="password"
              id="register-password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
              disabled
              aria-describedby="register-password-error password-requirements"
            />
            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V6Z"
              />
            </svg>
            <button
              type="button"
              class="password-toggle"
              data-target="register-password"
              aria-label="Show password"
              aria-pressed="false"
            >
                <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                    <path
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                    />
                    <circle
                        cx="12"
                        cy="12"
                        r="2.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />
                </svg>
            </button>
          </div>
          <p id="register-password-error" class="field-error" aria-live="polite"></p>

          <ul id="password-requirements" class="password-requirements">
            <li data-requirement="minLength">At least 8 characters</li>
            <li data-requirement="uppercase">At least 1 uppercase letter</li>
            <li data-requirement="lowercase">At least 1 lowercase letter</li>
            <li data-requirement="number">At least 1 number</li>
            <li data-requirement="special">At least 1 special character</li>
          </ul>

          <!--Confirm Password Input-->
          <label for="register-confirm-password">Confirm Password</label>
          <div class="input-icon-wrapper">
            <input
              type="password"
              id="register-confirm-password"
              name="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
              disabled
              aria-describedby="register-confirm-password-error"
            />
            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V6Z"
              />
            </svg>
            <button
              type="button"
              class="password-toggle"
              data-target="register-confirm-password"
              aria-label="Show password"
              aria-pressed="false"
            >
                <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                    <path
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                    />
                    <circle
                        cx="12"
                        cy="12"
                        r="2.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />
                </svg>
            </button>
          </div>
          <p
            id="register-confirm-password-error"
            class="field-error"
            aria-live="polite"
          ></p>

          <button type="submit" id="register-btn" disabled>Register</button>
        </form>
      </section>
    </main>
  </body>
</html>
